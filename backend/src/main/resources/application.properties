spring.application.name=subsidy-tracking

# Datasource Configuration (MySQL with fallback parameters)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/subsidy_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Prasanna@21}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 Console (for debugging / development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=${JWT_SECRET:your_jwt_secret_key_government_subsidy_tracking_system_2026_super_secure}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server Port
server.port=${SERVER_PORT:8081}
